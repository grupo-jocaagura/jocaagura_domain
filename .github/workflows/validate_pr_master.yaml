name: Validate Merge to master from develop

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: validate-master-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release_readiness:
    name: Release provenance and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r .github/scripts/requirements.txt
      - name: Require official develop PR, new version, dated notes and public eligibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:pubspec.yaml" > "$RUNNER_TEMP/master-pubspec.yaml"
          python3 .github/scripts/publication_policy.py --pr-event "$GITHUB_EVENT_PATH" --base-pubspec "$RUNNER_TEMP/master-pubspec.yaml" --require-new

  ci:
    name: Full release CI
    uses: ./.github/workflows/validate_pr.yaml
    with:
      target_branch: master

  validate_master_pr:
    # Preserve the existing required check in the master ruleset.
    name: Validate PR to master
    needs: [release_readiness, ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every release gate
        env:
          RELEASE_RESULT: ${{ needs.release_readiness.result }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          test "$RELEASE_RESULT" = success
          test "$CI_RESULT" = success
