name: Validate PR to develop

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-develop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  base_validation:
    name: Base validation
    uses: ./.github/workflows/validate_commits_and_lints.yaml

  validate_pr:
    name: Validate PR to develop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - base_validation

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true
          cache-sdk: true

      - name: Validate target branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.base_ref }}" != "develop" ]]; then
            echo "::error::This workflow only validates pull requests targeting develop."
            exit 1
          fi

      - name: Validate CHANGELOG update
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          if ! git diff --name-only "${BASE_SHA}..${HEAD_SHA}" \
            | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md must be updated in this PR."
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce minimum line coverage
        shell: bash
        env:
          MIN_COVERAGE: "90.00"
        run: |
          set -euo pipefail

          if [[ ! -f coverage/lcov.info ]]; then
            echo "::error::coverage/lcov.info was not generated."
            exit 1
          fi

          read -r LF LH < <(
            awk -F: '
              /^LF:/ { found += $2 }
              /^LH:/ { hit += $2 }
              END { print found + 0, hit + 0 }
            ' coverage/lcov.info
          )

          if [[ "$LF" -eq 0 ]]; then
            echo "::error::No instrumented lines were found in coverage/lcov.info."
            exit 1
          fi

          COVERAGE="$(
            awk -v hit="$LH" -v found="$LF" \
              'BEGIN { printf "%.2f", (hit / found) * 100 }'
          )"

          echo "Lines found: $LF"
          echo "Lines hit:   $LH"
          echo "Coverage:    $COVERAGE%"
          echo "Minimum:     $MIN_COVERAGE%"

          if ! awk -v actual="$COVERAGE" -v minimum="$MIN_COVERAGE" \
            'BEGIN { exit !(actual >= minimum) }'; then
            echo "::error::Line coverage $COVERAGE% is below required $MIN_COVERAGE%."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install schema tooling
        run: npm ci

      - name: Validate JSON schemas
        run: npm run validate:schemas

      - name: Validate package publication
        run: flutter pub publish --dry-run

      - name: Write PR validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PR validation"
            echo ""
            echo "- Target: develop"
            echo "- Repository mutation: none"
            echo "- Version mutation: none"
            echo "- Publication: dry-run only"
            echo "- Minimum line coverage: 90.00%"
          } >> "$GITHUB_STEP_SUMMARY"